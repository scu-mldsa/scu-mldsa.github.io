name: Auto Sync GitHub Organization Activity & Contributors

on:
  schedule:
    - cron: '15 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch GitHub Organization Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_NAME: ${{ github.repository_owner }}
        run: node .github/sync-github.mjs

      - name: Commit updated stats if changed
        run: |
          if [ -f assets/github-stats.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f assets/github-stats.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: auto update GitHub contribution stats"
              git pull --rebase origin main || true
              git push origin main || true
            fi
          fi
